name: KeydApp
options:
  bundleIdPrefix: com.keyd
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  indentWidth: 4
  tabWidth: 4
  generateEmptyDirectories: true

packages:
  SharedProtocol:
    path: ../SharedProtocol

targets:
  KeydApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KeydApp
        createIntermediateGroups: true
    info:
      path: KeydApp/Info.plist
      properties:
        UIBackgroundModes:
          - voip
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "KeydApp needs local network access to connect to the macOS agent over AWDL/Bonjour."
        NSBonjourServices:
          - _keyd._tcp
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: "KeydApp needs camera access to scan the QR code displayed by KeydAgent on your Mac for pairing."
    entitlements:
      path: KeydApp/KeydApp.entitlements
      properties:
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keyd.app
        PRODUCT_NAME: KeydApp
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: SharedProtocol
      - target: KeydLiveActivity
        embed: true
    scheme:
      testTargets: [KeydAppTests]

  KeydAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KeydAppTests
        createIntermediateGroups: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keyd.app.tests
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: KeydApp
      - package: SharedProtocol
    scheme:
      testTargets: []

  KeydIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KeydIntegrationTests
        createIntermediateGroups: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryheff.keyd.app.integration-tests
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: KeydApp
      - package: SharedProtocol
    scheme:
      testTargets: []

  KeydLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KeydLiveActivity
        createIntermediateGroups: true
      # Share attributes definition with main app
      - path: KeydApp/LiveActivity/KeydConnectionAttributes.swift
        createIntermediateGroups: false
    info:
      path: KeydLiveActivity/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keyd.app.live-activity
        PRODUCT_NAME: KeydLiveActivity
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""
    dependencies: []
    scheme:
      testTargets: []
