\* TransportAgreement row; expected verdict in Makefile TRANSPORT_ROWS
\* Design: every property, and the system always comes to rest (Settles).
SPECIFICATION LiveSpec
CONSTANTS
    MaxFlaps = 4
    MaxGen = 2
    MaxAttempts = 1
    InitPeerKnown = FALSE
    RouteResync = TRUE
    AddrOnLink = TRUE
    DerivedState = TRUE
    IpadResync = TRUE
\* Bounded flapping reaches a state with nothing left to do (T5); that is rest, not deadlock.
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    LabelsMatch
    StreamOnlyWithRoute
    CodecMatches
    RestStreams
    RestUsesUsb
    RestCodec
    RestLabels
    RestIdleAlone
PROPERTIES
    Settles
