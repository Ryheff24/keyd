\* DeltaSync row; expected verdict in Makefile DELTA_ROWS
\* Control: no DropOldLink (a late keyframe of the old link resets the iPad). Must violate NoCorruption.
SPECIFICATION Spec
CONSTANTS
    MaxFrames = 6
    Cap = 2
    KeyEvery = 0
    GateBeforeCompress = TRUE
    MaxReconnects = 1
    KeyOnConnect = TRUE
    DropOldLink = FALSE
    DropAfterCompress = FALSE
\* All frames captured and delivered is the end of a bounded run, not a deadlock.
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoCorruption
