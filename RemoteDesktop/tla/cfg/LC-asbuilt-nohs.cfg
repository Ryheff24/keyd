\* Lifecycle row; expected verdict in Makefile LIFE_ROWS
\* As built: frames go out on a new connection with no handshake (P16 hides it).
SPECIFICATION FairSpec
CONSTANTS
    MaxConn = 3
    MaxInst = 2
    MaxOutside = 0
    MaxFlaps = 0
    MaxChanges = 3
    G = 2
    RestartOnNewConn = FALSE
    CountOnSend = FALSE
    AuthBeforeDisplace = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    HandshakeBeforeFrames
