\* StripeSync row; expected verdict in Makefile STRIPE_ROWS
\* Control: Mac emits before every stripe worker returns. Must violate NoCorruption.
SPECIFICATION Spec
CONSTANTS
    K = 2
    MaxFrames = 3
    MacJoin = FALSE
    IpadJoin = TRUE
\* All frames captured and published is the end of a bounded run, not a deadlock.
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoCorruption
