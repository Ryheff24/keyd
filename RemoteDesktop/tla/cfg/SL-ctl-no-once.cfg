\* SessionLanes row; expected verdict in Makefile LANES_ROWS
\* Control: starting capture does not clear awaiting. Must violate CaptureAtMostOnce.
SPECIFICATION FairSpec
CONSTANTS
    MaxRT = 2
    MaxCtl = 2
    MaxConn = 2
    Heavy = 2
    Split = TRUE
    ForwardCtl = TRUE
    ReadyCheck = TRUE
    Once = FALSE
    FreshCheck = TRUE
    SerialS = TRUE
    SerialJ = TRUE
\* Bounded sends end the run; that is not a deadlock.
CHECK_DEADLOCK FALSE
INVARIANTS
    RTNotBehindHeavy
    RTInOrder
    CtlInOrder
    CaptureAtMostOnce
    CaptureOnlyWhenReady
