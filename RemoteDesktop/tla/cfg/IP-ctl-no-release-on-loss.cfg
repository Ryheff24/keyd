\* InputPath row; expected verdict in Makefile INPUT_ROWS
\* Control: keep keys down when a connection ends. Must violate HeldNeedsLink.
SPECIFICATION Spec
CONSTANTS
    Keys = {k1, k2}
    Links = {usb, wifi}
    MaxSeq = 4
    MaxSession = 2
    SeqGuard = TRUE
    ReleaseOnLoss = FALSE
    Resync = TRUE
    StopRelease = TRUE
    CancelSync = TRUE
    SilenceDeadline = TRUE
\* Running out of sequence numbers or sessions is the end of a bounded run, not a deadlock.
CHECK_DEADLOCK FALSE
INVARIANTS
    HeldNeedsLink
