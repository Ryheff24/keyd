\* DeltaSync row; expected verdict in Makefile DELTA_ROWS
\* Control: no gate and no drop keeps sync but the queue grows past Cap. Must violate QueueBounded.
SPECIFICATION Spec
CONSTANTS
    MaxFrames = 8
    Cap = 2
    KeyEvery = 0
    GateBeforeCompress = FALSE
    DropAfterCompress = FALSE
\* All frames captured and delivered is the end of a bounded run, not a deadlock.
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoCorruption
    QueueBounded
