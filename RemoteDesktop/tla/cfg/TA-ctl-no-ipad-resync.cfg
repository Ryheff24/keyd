\* TransportAgreement row; expected verdict in Makefile TRANSPORT_ROWS
\* Control: without IpadResync the viewport report goes out on a dead route and the Mac never gets it.
SPECIFICATION Spec
CONSTANTS
    MaxFlaps = 4
    MaxGen = 2
    MaxAttempts = 1
    InitPeerKnown = FALSE
    RouteResync = TRUE
    AddrOnLink = TRUE
    DerivedState = TRUE
    IpadResync = FALSE
\* Bounded flapping reaches a state with nothing left to do (T5); that is rest, not deadlock.
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    RestStreams
