\* SessionLanes row; expected verdict in Makefile LANES_ROWS
\* Control: a forwarded media-ready starts capture even if that link is already down. Must violate CaptureOnlyWhenReady.
SPECIFICATION FairSpec
CONSTANTS
    MaxRT = 2
    MaxCtl = 2
    MaxConn = 2
    Heavy = 2
    Split = TRUE
    ForwardCtl = TRUE
    ReadyCheck = TRUE
    Once = TRUE
    FreshCheck = FALSE
    SerialS = TRUE
    SerialJ = TRUE
\* Bounded sends end the run; that is not a deadlock.
CHECK_DEADLOCK FALSE
INVARIANTS
    RTNotBehindHeavy
    RTInOrder
    CtlInOrder
    CaptureAtMostOnce
    CaptureOnlyWhenReady
