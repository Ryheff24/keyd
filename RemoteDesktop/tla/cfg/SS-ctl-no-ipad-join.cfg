\* StripeSync row; expected verdict in Makefile STRIPE_ROWS
\* Control: iPad hands the frame to the renderer before every worker returns. Must violate NoTornPublish.
SPECIFICATION Spec
CONSTANTS
    K = 2
    MaxFrames = 3
    MacJoin = TRUE
    IpadJoin = FALSE
\* All frames captured and published is the end of a bounded run, not a deadlock.
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoCorruption
    NoTornPublish
