\* PairingPersistence row; expected verdict in Makefile PERSIST_ROWS
\* Control: credentials kept, but a stalled discovery is never restarted (temporal).
SPECIFICATION FairSpec
CONSTANTS
    MaxFlaps = 3
    MaxStalls = 2
    KeepCreds = TRUE
    RestartOnTimeout = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    CredsOnlyOwnerForgets
PROPERTY
    Reconnects
