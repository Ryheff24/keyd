\* SessionLanes row; expected verdict in Makefile LANES_ROWS
\* As built: session work inline on the transport queue. Must violate RTNotBehindHeavy.
SPECIFICATION FairSpec
CONSTANTS
    MaxRT = 2
    MaxCtl = 2
    MaxConn = 2
    Heavy = 2
    Split = FALSE
    ForwardCtl = TRUE
    ReadyCheck = TRUE
    Once = TRUE
    FreshCheck = TRUE
    SerialS = TRUE
    SerialJ = TRUE
\* Bounded sends end the run; that is not a deadlock.
CHECK_DEADLOCK FALSE
INVARIANTS
    RTNotBehindHeavy
    RTInOrder
    CtlInOrder
    CaptureAtMostOnce
    CaptureOnlyWhenReady
