\* Framing row; expected verdict in Makefile FRAMING_ROWS
\* As built: every TCP region dispatched as one message. Must violate NoTornMessage.
SPECIFICATION Spec
CONSTANTS
    Lens <- Lens3
    Framed = FALSE
    KeepPartial = TRUE
\* The whole stream delivered is the end of a bounded run, not a deadlock.
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoTornMessage
