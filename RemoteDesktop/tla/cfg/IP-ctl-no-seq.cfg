\* InputPath row; expected verdict in Makefile INPUT_ROWS
\* Control: no sequence guard. Must violate InOrder (a slow old link delivers after the new one).
SPECIFICATION Spec
CONSTANTS
    Keys = {k1, k2}
    Links = {usb, wifi}
    MaxSeq = 4
    MaxSession = 2
    SeqGuard = FALSE
    ReleaseOnLoss = TRUE
    Resync = TRUE
    StopRelease = TRUE
    CancelSync = TRUE
    SilenceDeadline = TRUE
