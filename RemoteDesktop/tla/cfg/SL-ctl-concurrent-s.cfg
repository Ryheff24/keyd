\* SessionLanes row; expected verdict in Makefile LANES_ROWS
\* Control: S is concurrent, not serial. Must violate CtlInOrder.
SPECIFICATION FairSpec
CONSTANTS
    MaxRT = 2
    MaxCtl = 2
    MaxConn = 2
    Heavy = 2
    Split = TRUE
    ForwardCtl = TRUE
    ReadyCheck = TRUE
    Once = TRUE
    FreshCheck = TRUE
    SerialS = FALSE
    SerialJ = TRUE
\* Bounded sends end the run; that is not a deadlock.
CHECK_DEADLOCK FALSE
INVARIANTS
    CtlInOrder
