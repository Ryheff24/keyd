\* FrameLoop row; expected verdict in the Makefile FL_ROWS
\* Design: every switch on; faults combined: a loss, a restart, a Mac relaunch and a decode failure in one run (two routes).
SPECIFICATION FairSpec
CONSTANTS
    MaxConn = 2
    MaxScr = 2
    MaxLost = 1
    MaxRestart = 1
    MaxRoute = 2
    MaxRelaunch = 1
    MaxFail = 1
    IdleTicks = FALSE
    KeyOnBreak = TRUE
    HsConn = TRUE
    KeyRetry = TRUE
    VpOnHsConn = TRUE
    IdleKey = TRUE
    EpochMonotone = TRUE
    AwaitOnFail = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
    NoGarbage Inv
    RestGood
PROPERTY
    Settles
