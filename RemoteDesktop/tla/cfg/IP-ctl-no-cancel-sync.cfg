\* InputPath row; expected verdict in Makefile INPUT_ROWS
\* Control: the iPad drops its held state silently. Must violate NoStuckKey.
SPECIFICATION Spec
CONSTANTS
    Keys = {k1, k2}
    Links = {usb, wifi}
    MaxSeq = 4
    MaxSession = 2
    SeqGuard = TRUE
    ReleaseOnLoss = TRUE
    Resync = TRUE
    StopRelease = TRUE
    CancelSync = FALSE
    SilenceDeadline = TRUE
