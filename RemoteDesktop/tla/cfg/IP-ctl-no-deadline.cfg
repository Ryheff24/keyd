\* InputPath row; expected verdict in Makefile INPUT_ROWS
\* Control: no silence deadline; a half-open link keeps the key down. Must violate DeadLinkReleases (Temporal).
SPECIFICATION FairSpec
CONSTANTS
    Keys = {k1, k2}
    Links = {usb, wifi}
    MaxSeq = 4
    MaxSession = 2
    SeqGuard = TRUE
    ReleaseOnLoss = TRUE
    Resync = TRUE
    StopRelease = TRUE
    CancelSync = TRUE
    SilenceDeadline = FALSE
\* Running out of sequence numbers or sessions is the end of a bounded run, not a deadlock.
CHECK_DEADLOCK FALSE
PROPERTY
    DeadLinkReleases
