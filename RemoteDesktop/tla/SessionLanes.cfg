\* SessionLanes row; expected verdict in Makefile LANES_ROWS
\* Design: realtime on T, session work on serial S, permanent media callback + awaiting + ready check. Must pass.
SPECIFICATION FairSpec
CONSTANTS
    MaxRT = 2
    MaxCtl = 2
    MaxConn = 2
    Heavy = 2
    Split = TRUE
    ForwardCtl = TRUE
    ReadyCheck = TRUE
    Once = TRUE
    FreshCheck = TRUE
    SerialS = TRUE
    SerialJ = TRUE
\* Bounded sends end the run; that is not a deadlock.
CHECK_DEADLOCK FALSE
INVARIANTS
    RTNotBehindHeavy
    RTInOrder
    CtlInOrder
    CaptureAtMostOnce
    CaptureOnlyWhenReady
PROPERTY
    CaptureStarts
