\* FrameRing row; expected verdict in Makefile FRAME_ROWS
\* Design: 4-slot ring, GPU-gated reuse, FIFO, K-tick drain. Must pass.
SPECIFICATION Spec
CONSTANTS
    NSlots = 4
    QCap = 2
    InFlight = 3
    K = 2
    MaxFrames = 6
    Ring = TRUE
    WaitForGPU = TRUE
    Drain = TRUE
    Fifo = TRUE
\* All frames arrived and the GPU idle is the end of a bounded run, not a deadlock.
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoWriteWhileRead
    InOrder
    BoundedBacklog
