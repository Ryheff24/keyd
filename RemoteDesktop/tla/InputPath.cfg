\* InputPath row; expected verdict in Makefile INPUT_ROWS
\* Design: seq guard, release on loss, release-only resync on every connect/switch, release on stop. Must pass.
SPECIFICATION Spec
CONSTANTS
    Keys = {k1, k2}
    Links = {usb, wifi}
    MaxSeq = 4
    MaxSession = 2
    SeqGuard = TRUE
    ReleaseOnLoss = TRUE
    Resync = TRUE
    StopRelease = TRUE
\* Running out of sequence numbers or sessions is the end of a bounded run, not a deadlock.
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoStuckKey
    HeldNeedsLink
    InOrder
    StopReleasesAll
