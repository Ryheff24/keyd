\* StripeSync row; expected verdict in Makefile STRIPE_ROWS
\* Design: K parallel stripes, join on both ends. Must pass.
SPECIFICATION Spec
CONSTANTS
    K = 3
    MaxFrames = 3
    MacJoin = TRUE
    IpadJoin = TRUE
\* All frames captured and published is the end of a bounded run, not a deadlock.
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoCorruption
    NoTornPublish
    MacRefUniform
