\* DeltaSync row; expected verdict in Makefile DELTA_ROWS
\* Design: gate before compress, never drop a compressed frame. Must pass.
SPECIFICATION Spec
CONSTANTS
    MaxFrames = 8
    Cap = 2
    KeyEvery = 0
    GateBeforeCompress = TRUE
    MaxReconnects = 0
    KeyOnConnect = TRUE
    DropOldLink = TRUE
    DropAfterCompress = FALSE
\* All frames captured and delivered is the end of a bounded run, not a deadlock.
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoCorruption
    QueueBounded
    QueueIsChain
